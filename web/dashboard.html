<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    /* Chart roles (dataviz reference palette, validated: 7 slots light). Text stays in ink tokens. */
    .viz-root {
      --surface-1: #ffffff;
      --text-primary: #1f2328;
      --text-secondary: #59636e;
      --grid: #eef0f3;
      --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
      --series-5: #e87ba4; --series-6: #008300; --series-7: #6250d6;
      --critical: #d03b3b;
    }
    body.wide { max-width: 1100px; }
    .filters { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
    .filters .field { margin: 0; }
    .quick { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .quick button { background: #e6e9ee; color: var(--fg); padding: 6px 12px; font-size: 0.9rem; }
    .quick button.active { background: #06c755; color: #fff; }
    .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 8px; }
    .tile { background: var(--card); border-radius: 8px; padding: 12px; }
    .tile .n { font-size: 1.6rem; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
    .tile .n.alert { color: var(--critical); }
    .tile .l { color: var(--muted); font-size: 0.85rem; }
    .charts { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .chart { background: var(--card); border-radius: 8px; padding: 12px; }
    .chart h2 { margin: 0 0 4px; }
    .chart .sub { color: var(--muted); font-size: 0.8rem; margin-bottom: 8px; }
    .chart .canvas { position: relative; height: 260px; }
    .chart details { margin-top: 6px; font-size: 0.85rem; }
    table.data { width: 100%; border-collapse: collapse; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
    table.data th, table.data td { text-align: left; padding: 6px 4px; border-bottom: 1px solid #eef0f3; }
    table.data td.num, table.data th.num { text-align: right; }
    .scroll { overflow-x: auto; }
    @media (min-width: 760px) {
      .filters { grid-template-columns: repeat(4, 1fr); }
      .tiles { grid-template-columns: repeat(4, 1fr); }
      .charts { grid-template-columns: 1fr 1fr; }
      .chart.full { grid-column: 1 / -1; }
    }
  </style>
</head>
<body class="wide viz-root">
  <main id="app"></main>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/liff.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    // PLAN §13. Colour follows the entity (fixed slot per branch / category / status group),
    // never its rank, so filtering never repaints the survivors.
    const SERIES = [1, 2, 3, 4, 5, 6, 7].map(function (i) { return 'var(--series-' + i + ')'; });
    const STATUS_GROUPS = [
      { key: 'open', label: 'ยังไม่เสร็จ', statuses: ['NEW', 'ASSIGNED', 'REJECTED', 'ACCEPTED', 'IN_PROGRESS'] },
      { key: 'done', label: 'รอรับทราบ', statuses: ['DONE'] },
      { key: 'closed', label: 'ปิดแล้ว', statuses: ['CLOSED'] },
      { key: 'cancelled', label: 'ยกเลิก', statuses: ['CANCELLED'] },
    ];
    const RANGES = [{ days: 30, label: '30 วัน' }, { days: 90, label: '90 วัน' }, { days: 365, label: '1 ปี' }, { days: 0, label: 'ทั้งหมด' }];
    let ME = null;
    let charts = [];
    const state = { days: 90, from: '', to: '', branch_code: '', category_code: '', tech: '' };

    (async function () {
      ME = await startPage();
      if (!ME) return;
      if (ME.user.role !== 'ADMIN' && ME.user.role !== 'VIEWER') {
        return render(el('div', { class: 'center' },
          el('h1', {}, 'ไม่มีสิทธิ์เข้าถึง'),
          el('p', { class: 'muted' }, 'Dashboard สำหรับ Admin และผู้บริหารเท่านั้น'),
          el('a', { class: 'btn', href: 'jobs.html' }, 'กลับไปหน้ารายการงาน')));
      }
      setRange(90);
      await load();
    })();

    function cssVar(name) {
      const m = /var\((--[^)]+)\)/.exec(name);
      return m ? getComputedStyle(document.body).getPropertyValue(m[1]).trim() : name;
    }

    function ymd(d) {
      const p = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Bangkok', year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
      return p; // en-CA gives YYYY-MM-DD
    }

    function setRange(days) {
      state.days = days;
      state.to = days ? ymd(new Date()) : '';
      state.from = days ? ymd(new Date(Date.now() - (days - 1) * 86400000)) : '';
    }

    async function load() {
      const tilesSlot = el('div', { class: 'center' }, el('div', { class: 'spinner' }));
      render(header(), tilesSlot);
      let data;
      try {
        data = await api('dashboard', {
          from: state.from, to: state.to, branch_code: state.branch_code, category_code: state.category_code, tech: state.tech,
        });
      } catch (err) {
        clear(tilesSlot).appendChild(el('p', { class: 'err' }, errorText(err)));
        return;
      }
      charts.forEach(function (c) { c.destroy(); });
      charts = [];
      render(header(data.techs), body(data));
      drawCharts(data);
    }

    // --- filters (one row above everything) -------------------------------------------------

    function header(techs) {
      const from = el('input', { type: 'date', value: state.from });
      const to = el('input', { type: 'date', value: state.to });
      const branch = el('select', {}, option('', 'ทุกร้าน'), ME.branches.map(function (b) { return option(b.branch_code, b.name, b.branch_code === state.branch_code); }));
      const category = el('select', {}, option('', 'ทุกหมวด'), ME.categories.map(function (c) { return option(c.category_code, c.name_th, c.category_code === state.category_code); }));
      const tech = el('select', {}, option('', 'ช่างทุกคน'), (techs || (state.tech ? [state.tech] : [])).map(function (t) { return option(t, t, t === state.tech); }));
      const apply = function () {
        Object.assign(state, { from: from.value, to: to.value, branch_code: branch.value, category_code: category.value, tech: tech.value, days: -1 });
        load();
      };
      [from, to, branch, category, tech].forEach(function (c) { c.addEventListener('change', apply); });
      return [
        el('h1', {}, 'Dashboard งานซ่อม'),
        el('div', { class: 'quick' }, RANGES.map(function (r) {
          return el('button', { type: 'button', class: state.days === r.days ? 'active' : '', onclick: function () { setRange(r.days); load(); } }, r.label);
        })),
        el('div', { class: 'filters' },
          field('ตั้งแต่', from), field('ถึง', to), field('ร้าน', branch), field('หมวด', category)),
        el('div', { class: 'filters' }, field('ช่าง / ช่างนอก', tech)),
      ];
    }

    // --- layout -----------------------------------------------------------------------------

    function body(d) {
      const pct = function (x) { return x === null || x === undefined ? '-' : Math.round(x * 100) + '%'; };
      const tile = function (n, label, alert) { return el('div', { class: 'tile' }, el('div', { class: 'n' + (alert ? ' alert' : '') }, n), el('div', { class: 'l' }, label)); };
      return [
        el('div', { class: 'tiles' },
          tile(d.cards.open_count, 'งานที่ยังไม่เสร็จ'),
          tile(d.cards.overdue_count, 'งานเลยกำหนด', d.cards.overdue_count > 0),
          tile(d.cards.avg_response_hours === null ? '-' : d.cards.avg_response_hours + ' ชม.', 'เวลาเข้าหน้างานเฉลี่ย'),
          tile(fmtMoney(d.cards.cost_this_month), 'ค่าซ่อมเดือนนี้')),
        el('div', { class: 'tiles' },
          tile(d.kpi.total, 'งานในช่วงที่เลือก'),
          tile(pct(d.kpi.maintenance_rate), 'ปิดงานแล้ว (Maintenance)'),
          tile(pct(d.kpi.lead_time_rate), 'เสร็จทันกำหนด (Lead Time)'),
          tile(pct(d.kpi.repeat_rate), 'งานซ่อมซ้ำ (Quality)')),
        el('div', { class: 'charts' },
          chartBox('c-branch', 'งานตามร้านและสถานะ', 'จำนวนงานที่แจ้งในช่วงที่เลือก', tableBranch(d)),
          chartBox('c-month', 'งานรายเดือนตามหมวด', 'นับจากวันที่แจ้ง', tableMonth(d)),
          chartBox('c-cost', 'ค่าซ่อมรายเดือนตามร้าน', 'นับจากวันที่ซ่อมเสร็จ (บาท)', tableCost(d), true),
          el('div', { class: 'chart full' }, el('h2', {}, 'ผลงานช่าง'), el('div', { class: 'scroll' }, tableTech(d))),
          el('div', { class: 'chart full' }, el('h2', {}, 'งานเลยกำหนด (' + d.cards.overdue_count + ')'),
            el('div', { class: 'sub' }, 'งานที่ยังไม่เสร็จและเลยกำหนดเสร็จแล้ว แสดงไม่เกิน 20 งาน'), el('div', { class: 'scroll' }, tableOverdue(d))),
          el('div', { class: 'chart full' }, el('h2', {}, 'งานที่อาจซ่อมซ้ำ'),
            el('div', { class: 'sub' }, 'ร้าน Area และหมวดเดียวกัน แจ้งใหม่ภายใน 7 วันหลังงานก่อนปิด'), el('div', { class: 'scroll' }, tableRepeat(d)))),
      ];
    }

    function chartBox(id, title, sub, table, full) {
      return el('div', { class: 'chart' + (full ? ' full' : '') },
        el('h2', {}, title), el('div', { class: 'sub' }, sub),
        el('div', { class: 'canvas' }, el('canvas', { id: id, role: 'img', 'aria-label': title })),
        el('details', {}, el('summary', {}, 'ดูเป็นตาราง'), el('div', { class: 'scroll' }, table)));
    }

    function table(headers, rows, numCols) {
      if (!rows.length) return el('p', { class: 'muted' }, 'ไม่มีข้อมูล');
      return el('table', { class: 'data' },
        el('thead', {}, el('tr', {}, headers.map(function (h, i) { return el('th', { class: numCols.indexOf(i) !== -1 ? 'num' : '' }, h); }))),
        el('tbody', {}, rows.map(function (r) {
          return el('tr', {}, r.map(function (c, i) { return el('td', { class: numCols.indexOf(i) !== -1 ? 'num' : '' }, c); }));
        })));
    }

    // --- data shaping -------------------------------------------------------------------------

    const branchName = function (code) { return nameOf(ME.branches, 'branch_code', code, 'name'); };
    const categoryName = function (code) { return nameOf(ME.categories, 'category_code', code, 'name_th'); };
    const thMonth = function (ym) {
      const p = ym.split('-');
      return new Date(Date.UTC(+p[0], +p[1] - 1, 15)).toLocaleDateString('th-TH', { month: 'short', year: '2-digit', timeZone: 'UTC' });
    };
    const uniq = function (list) { return list.filter(function (x, i) { return list.indexOf(x) === i; }); };
    const sum = function (rows, pick) { return rows.reduce(function (s, r) { return s + pick(r); }, 0); };

    function branchMatrix(d) {
      const branches = ME.branches.map(function (b) { return b.branch_code; })
        .filter(function (b) { return d.by_branch_status.some(function (r) { return r.branch === b; }); });
      return STATUS_GROUPS.map(function (g, gi) {
        return {
          label: g.label, color: SERIES[gi],
          values: branches.map(function (b) { return sum(d.by_branch_status.filter(function (r) { return r.branch === b && g.statuses.indexOf(r.status) !== -1; }), function (r) { return r.count; }); }),
        };
      }).filter(function (s) { return s.values.some(Boolean); }).concat([{ branches: branches }]);
    }

    function monthMatrix(d) {
      const months = uniq(d.by_month_category.map(function (r) { return r.month; })).sort();
      const series = ME.categories.map(function (c, ci) {
        return {
          label: c.name_th, color: SERIES[ci % SERIES.length],
          values: months.map(function (m) { return sum(d.by_month_category.filter(function (r) { return r.month === m && r.category === c.category_code; }), function (r) { return r.count; }); }),
        };
      }).filter(function (s) { return s.values.some(Boolean); });
      return { months: months, series: series };
    }

    function costMatrix(d) {
      const months = uniq(d.cost_by_branch_month.map(function (r) { return r.month; })).sort();
      const series = ME.branches.map(function (b, bi) {
        return {
          label: b.name, color: SERIES[bi % SERIES.length],
          values: months.map(function (m) { return sum(d.cost_by_branch_month.filter(function (r) { return r.month === m && r.branch === b.branch_code; }), function (r) { return r.cost; }); }),
        };
      }).filter(function (s) { return s.values.some(Boolean); });
      return { months: months, series: series };
    }

    function tableBranch(d) {
      const m = branchMatrix(d);
      const branches = m.pop().branches;
      return table(['ร้าน'].concat(m.map(function (s) { return s.label; })),
        branches.map(function (b, i) { return [branchName(b)].concat(m.map(function (s) { return s.values[i]; })); }),
        m.map(function (_, i) { return i + 1; }));
    }

    function tableMonth(d) {
      const m = monthMatrix(d);
      return table(['เดือน'].concat(m.series.map(function (s) { return s.label; })),
        m.months.map(function (mo, i) { return [thMonth(mo)].concat(m.series.map(function (s) { return s.values[i]; })); }),
        m.series.map(function (_, i) { return i + 1; }));
    }

    function tableCost(d) {
      const m = costMatrix(d);
      return table(['เดือน'].concat(m.series.map(function (s) { return s.label; })),
        m.months.map(function (mo, i) { return [thMonth(mo)].concat(m.series.map(function (s) { return s.values[i].toLocaleString('th-TH'); })); }),
        m.series.map(function (_, i) { return i + 1; }));
    }

    function tableTech(d) {
      const pct = function (x) { return x === null ? '-' : Math.round(x * 100) + '%'; };
      return table(['ช่าง / ช่างนอก', 'งาน', 'เข้าหน้างานเฉลี่ย', 'เสร็จทันกำหนด'],
        d.by_tech.slice().sort(function (a, b) { return b.jobs - a.jobs; }).map(function (t) {
          return [t.tech, t.jobs, t.avg_response_hours === null ? '-' : t.avg_response_hours + ' ชม.', pct(t.on_time_rate)];
        }), [1, 2, 3]);
    }

    function tableOverdue(d) {
      return table(['งาน', 'ร้าน', 'ผู้รับงาน', 'กำหนดเสร็จ', 'เลยมา'],
        d.overdue_list.map(function (j) {
          return [el('a', { href: 'job.html?id=' + encodeURIComponent(j.job_id) }, j.job_id + ' ' + j.title), branchName(j.branch_code), j.tech, fmtDate(j.due_at),
            j.hours_overdue >= 48 ? Math.floor(j.hours_overdue / 24) + ' วัน' : j.hours_overdue + ' ชม.'];
        }), [4]);
    }

    function tableRepeat(d) {
      return table(['งานใหม่', 'งานก่อนหน้า', 'ร้าน · Area · หมวด', 'แจ้งเมื่อ'],
        d.repeat_candidates.map(function (r) {
          return [el('a', { href: 'job.html?id=' + encodeURIComponent(r.job_id) }, r.job_id + ' ' + r.title),
            el('a', { href: 'job.html?id=' + encodeURIComponent(r.previous_job_id) }, r.previous_job_id),
            branchName(r.branch_code) + ' · ' + r.area + ' · ' + categoryName(r.category_code), fmtDate(r.created_at)];
        }), []);
    }

    // --- charts (Chart.js) ----------------------------------------------------------------------

    function drawCharts(d) {
      const b = branchMatrix(d);
      const branches = b.pop().branches;
      stacked('c-branch', branches.map(branchName), b, true, 'งาน');
      const m = monthMatrix(d);
      stacked('c-month', m.months.map(thMonth), m.series, false, 'งาน');
      const c = costMatrix(d);
      stacked('c-cost', c.months.map(thMonth), c.series, false, 'บาท');
    }

    /** Stacked bars: thin bars, 2px surface gap between segments, recessive grid, legend + hover tooltip. */
    function stacked(id, labels, series, horizontal, unit) {
      const canvas = document.getElementById(id);
      if (!canvas) return;
      if (!labels.length || !series.length) {
        canvas.parentNode.replaceChild(el('p', { class: 'muted center' }, 'ไม่มีข้อมูลในช่วงที่เลือก'), canvas);
        return;
      }
      const surface = cssVar('var(--surface-1)');
      const ink2 = cssVar('var(--text-secondary)');
      const grid = cssVar('var(--grid)');
      const valueAxis = horizontal ? 'x' : 'y';
      const scales = { x: { stacked: true, grid: { display: horizontal, color: grid }, ticks: { color: ink2 }, border: { display: false } },
        y: { stacked: true, grid: { display: !horizontal, color: grid }, ticks: { color: ink2 }, border: { display: false } } };
      scales[valueAxis].beginAtZero = true;
      scales[valueAxis].ticks.precision = 0;
      charts.push(new Chart(canvas, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: series.map(function (s) {
            return {
              label: s.label, data: s.values, backgroundColor: cssVar(s.color),
              borderColor: surface, borderWidth: 2, borderSkipped: false, borderRadius: 4,
              maxBarThickness: 28, categoryPercentage: 0.7,
            };
          }),
        },
        options: {
          indexAxis: horizontal ? 'y' : 'x', responsive: true, maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          scales: scales,
          plugins: {
            legend: { position: 'bottom', labels: { color: ink2, boxWidth: 12, boxHeight: 12, usePointStyle: true, pointStyle: 'rectRounded' } },
            tooltip: { filter: function (ctx) { return !!ctx.raw; }, callbacks: { label: function (ctx) { return ' ' + ctx.dataset.label + ': ' + ctx.raw.toLocaleString('th-TH') + ' ' + unit; } } },
          },
        },
      }));
    }
  </script>
</body>
</html>
