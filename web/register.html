<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ลงทะเบียน</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="app"></main>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="js/config.js"></script>
  <script src="js/liff.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    (async function () {
      const me = await startPage({ requireUser: false });
      if (!me) return;
      const user = me.user || {};
      // Only our own pages, so the link cannot bounce users to another site.
      const next = /^[a-z]+\.html(\?[^#]*)?$/.test(param('next') || '') ? param('next') : '';

      const realName = el('input', { type: 'text', maxlength: 100, autocomplete: 'name', value: user.real_name || '' });
      const phone = el('input', { type: 'tel', maxlength: 20, autocomplete: 'tel', inputmode: 'tel', value: user.phone || '' });
      const branch = el('select', {},
        option('', me.user && me.user.role !== 'STAFF' ? '— ไม่มีร้านสังกัด —' : '— เลือกร้าน —'),
        me.branches.map(function (b) { return option(b.branch_code, b.name, b.branch_code === user.branch_code); }));
      // The server only lets STAFF move branch (it bounds a MANAGER's rights); others ask the Admin.
      const branchLocked = !!me.user && me.user.role !== 'STAFF';
      branch.disabled = branchLocked;
      const msg = el('p', { class: 'msg', hidden: true });
      const submit = el('button', { type: 'submit', class: 'btn' }, me.user ? 'บันทึก' : 'ลงทะเบียน');

      const form = el('form', { novalidate: true },
        field('ชื่อจริง', realName),
        field('เบอร์โทร', phone, 'ช่างจะโทรถามอาการตามเบอร์นี้'),
        field('ร้าน', branch, branchLocked ? 'เปลี่ยนร้านได้โดย Admin เท่านั้น' : null),
        msg, submit);

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        if (!realName.value.trim()) return invalid(msg, 'กรุณากรอกชื่อจริง', realName);
        if (!/^[0-9+\-\s]{6,20}$/.test(phone.value.trim())) return invalid(msg, 'กรุณากรอกเบอร์โทรให้ถูกต้อง', phone);
        if (!branchLocked && !branch.value) return invalid(msg, 'กรุณาเลือกร้าน', branch);
        const result = await busy(submit, msg, 'กำลังบันทึก…', function () {
          return api('register', { real_name: realName.value, phone: phone.value, branch_code: branch.value });
        });
        if (!result) return;
        if (next) return location.replace(next);
        render(el('div', { class: 'center' },
          el('h1', {}, 'ลงทะเบียนเรียบร้อย'),
          el('p', { class: 'muted' }, 'ใช้เมนู "แจ้งซ่อม" ในแชทเพื่อแจ้งงานได้เลย'),
          el('a', { class: 'btn', href: 'report.html' }, 'แจ้งซ่อม'),
          liff.isInClient() ? el('button', { type: 'button', class: 'btn btn-secondary', onclick: function () { liff.closeWindow(); } }, 'ปิด') : null));
      });

      render(
        el('h1', {}, me.user ? 'ข้อมูลของฉัน' : 'ลงทะเบียน'),
        me.user ? null : el('p', { class: 'muted' }, 'กรอกข้อมูลครั้งเดียว ใช้แจ้งซ่อมและรับการแจ้งเตือนผ่าน LINE'),
        form);
    })();
  </script>
</body>
</html>
