name: Deploy web

# PLAN §16: with prod configured, `/` serves prod and `/test/` serves test, each with its own
# js/config.js written from repository variables. Until LIFF_ID_PROD is set, `/` keeps serving
# the test config committed in web/js/config.js (and `/test/` is a copy), so nothing breaks
# before the prod LIFF app exists. `/test/` is built only while the repository variable
# TEST_ENABLED is "true" (switched off 9 Nov 2026); without it Pages serves prod only.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: Build _site (prod at /, test at /test/ when TEST_ENABLED)
        env:
          TEST_ENABLED: ${{ vars.TEST_ENABLED }}
          LIFF_ID_PROD: ${{ vars.LIFF_ID_PROD }}
          API_URL_PROD: ${{ vars.API_URL_PROD }}
          LIFF_ID_TEST: ${{ vars.LIFF_ID_TEST }}
          API_URL_TEST: ${{ vars.API_URL_TEST }}
        run: |
          set -eu
          write_config() { # dir liff_id api_url
            printf "// Generated by deploy-web.yml. Public, non-secret settings only.\nconst CONFIG = {\n  LIFF_ID: '%s',\n  API_URL: '%s',\n};\n" "$2" "$3" > "$1/js/config.js"
          }
          if [ "$TEST_ENABLED" = "true" ]; then
            mkdir -p _site/test
            cp -r web/. _site/test/
            if [ -n "$LIFF_ID_TEST" ] && [ -n "$API_URL_TEST" ]; then write_config _site/test "$LIFF_ID_TEST" "$API_URL_TEST"; fi
          else
            echo "TEST_ENABLED is not true: no /test/ pages"
          fi
          cp -r web/. _site/
          if [ -n "$LIFF_ID_PROD" ]; then
            if [ -z "$API_URL_PROD" ]; then echo "Variable API_URL_PROD is not set"; exit 1; fi
            write_config _site "$LIFF_ID_PROD" "$API_URL_PROD"
            echo "Root (/) uses the prod config"
          else
            echo "LIFF_ID_PROD not set: root (/) still uses the test config from web/js/config.js"
          fi
          grep -h "LIFF_ID" _site/js/config.js $(ls _site/test/js/config.js 2>/dev/null)
          # Pages serves files with max-age=600 and browsers reuse cached JS on reload, so each
          # deploy gives our js/css a new URL and pages never run yesterday's scripts.
          v="${GITHUB_SHA::7}"
          sed -i -E "s#(src|href)=\"((js|css)/[a-z]+\.(js|css))\"#\1=\"\2?v=$v\"#g" _site/*.html $(ls _site/test/*.html 2>/dev/null)
          grep -c "?v=$v" _site/dashboard.html $(ls _site/test/dashboard.html 2>/dev/null)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
